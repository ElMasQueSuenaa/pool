name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT: 4.7.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # ponytail: descarga ~1 GB de plantillas en cada push; cachear con actions/cache si se hace lento
      - name: Instalar Godot y plantillas Web
        run: |
          url=https://github.com/godotengine/godot-builds/releases/download/$GODOT-stable
          wget -q $url/Godot_v$GODOT-stable_linux.x86_64.zip $url/Godot_v$GODOT-stable_export_templates.tpz
          unzip -q Godot_v$GODOT-stable_linux.x86_64.zip
          tpl=~/.local/share/godot/export_templates/$GODOT.stable
          mkdir -p $tpl
          unzip -q -j Godot_v$GODOT-stable_export_templates.tpz 'templates/web_nothreads_*' -d $tpl

      # Si una prueba falla, no se publica. timeout: un script de prueba que falla a medias
      # no llega a quit() y Godot se quedaría abierto para siempre
      - name: Pruebas
        run: |
          ./Godot_v$GODOT-stable_linux.x86_64 --headless --import
          timeout 120 ./Godot_v$GODOT-stable_linux.x86_64 --headless -s tests/test_rules.gd
          timeout 120 ./Godot_v$GODOT-stable_linux.x86_64 --headless --fixed-fps 240 -s tests/test_powers.gd
          timeout 600 ./Godot_v$GODOT-stable_linux.x86_64 --headless --fixed-fps 240 -s tests/test_break.gd

      - name: Exportar a Web
        run: |
          mkdir -p build/web
          ./Godot_v$GODOT-stable_linux.x86_64 --headless --export-release Web build/web/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v5
